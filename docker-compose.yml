services:
  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    image: simple-docker-webapp:latest
    container_name: simple-docker-webapp
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped
